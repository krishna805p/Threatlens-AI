services:
  threatlens-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: threatlens-backend:local
    container_name: threatlens-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./.secrets:/app/.secrets
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
